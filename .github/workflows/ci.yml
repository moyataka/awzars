name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  schedule:
    # Weekly run so newly published RustSec advisories surface between PRs.
    - cron: "0 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Superseded PR pushes are cancelled; every dev/main commit keeps its result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust (stable)
        run: |
          rustup toolchain install stable --profile minimal -c rustfmt -c clippy
          rustup default stable
          rustc --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.event_name != 'pull_request' }}
      - name: cargo fmt
        if: runner.os == 'Linux'
        run: cargo fmt --all --check
      - name: cargo clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: cargo test
        run: cargo test --all-targets --locked

  musl-static:
    name: static build (x86_64-unknown-linux-musl)
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust (stable + musl target)
        run: |
          rustup toolchain install stable --profile minimal -t x86_64-unknown-linux-musl
          rustup default stable
          rustc --version
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.0
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-zigbuild@0.23.4
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: musl
          save-if: ${{ github.event_name != 'pull_request' }}
      - name: cargo zigbuild
        run: cargo zigbuild --release --locked --target x86_64-unknown-linux-musl
      - name: Assert static linkage and smoke-run
        run: |
          BIN=target/x86_64-unknown-linux-musl/release/awzars
          file "$BIN"
          file "$BIN" | grep -Eq 'static-pie linked|statically linked'
          "$BIN" --version

  supply-chain:
    name: cargo-deny
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-deny@0.20.2
      - name: cargo deny check
        run: cargo deny --locked check

  pre-commit:
    name: pre-commit
    # Checks only what a pull request changes; dev/main pushes were checked in their PR.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The PR merge commit and its first parent, the base branch.
          fetch-depth: 2
          persist-credentials: false
      - name: Install Rust (stable)
        run: |
          rustup toolchain install stable --profile minimal -c rustfmt
          rustup default stable
          rustc --version
      - name: Install pre-commit
        run: |
          pipx install pre-commit==4.7.0
          pre-commit --version
      # Stage the PR's changes on top of the base branch, so every hook sees them the way it sees
      # a local commit. With --from-ref/--to-ref, gitleaks (it scans the staged diff) and
      # check-added-large-files (it checks staged additions) would pass without checking anything.
      - name: Stage the pull request's changes
        run: git reset --soft HEAD^1
      - name: pre-commit run
        run: pre-commit run --show-diff-on-failure --color=always
