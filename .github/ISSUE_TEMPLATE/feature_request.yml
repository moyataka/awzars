name: Feature request
description: Suggest a new option, behaviour or feature.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        This issue is public. Leave out account IDs, tenant and app IDs, role ARNs, emails and hostnames.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behaviour
      description: How should awzars behave? Include example commands or output if they help.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches or workarounds you tried, and why they fall short.
    validations:
      required: true
