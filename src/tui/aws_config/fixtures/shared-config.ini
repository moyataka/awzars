# Shared AWS configuration: preserve comments and layout.
[default]
region = us-east-1
output = json

[profile engineering]
region  = us-west-2
credential_process = awzars credential-process --profile engineering
output = json
azure_tenant_id = 11111111-2222-3333-4444-555555555555
sess_name = engineering-session
mfa_serial = arn:aws:iam::123456789012:mfa/engineer
duration_seconds = 7200
external_id = partner-account
sso_session = corp
sso_account_id = 123456789012
sso_role_name = Developer
custom_key = keep-me
s3 =
    max_concurrent_requests = 20
    addressing_style = path
; Keep this explanation next to the custom setting.
custom_multiline = first line
    second line
    [literal text, not a section]

[sso-session corp]
sso_start_url = https://example.awsapps.com/start
sso_region = us-east-1
sso_registration_scopes = sso:account:access

[services local]
s3 =
    endpoint_url = http://localhost:4566

[profile audit]
source_profile = engineering
role_arn = arn:aws:iam::123456789012:role/Audit
role_session_name = audit-session
region = eu-central-1
